services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - syla-postgres:/var/lib/postgresql/data
      - ./infra/local/init-postgres.sh:/docker-entrypoint-initdb.d/01-syla.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME: http://localhost:8081
      SYLA_LIFECYCLE_SECRET: ${SYLA_LIFECYCLE_SECRET:?Set SYLA_LIFECYCLE_SECRET in .env}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./infra/local/keycloak-realm.json:/opt/keycloak/data/import/syla-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8080; printf \"GET /realms/syla HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 5s
      timeout: 5s
      retries: 40
  core-api:
    build: ./services/core-api
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/syla
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WEB_ORIGIN: http://localhost:5173
      OIDC_ISSUER: http://localhost:8081/realms/syla
      IDENTITY_BACKCHANNEL: http://keycloak:8080
      SYLA_LIFECYCLE_SECRET: ${SYLA_LIFECYCLE_SECRET:?Set SYLA_LIFECYCLE_SECRET in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
  web:
    build: ./web
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      - core-api
volumes:
  syla-postgres:
