server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(oauth2|login|logout) {
        proxy_pass http://core-api:8080;
        proxy_set_header Host $http_host;
    }
    location /api/ {
        proxy_pass http://core-api:8080;
        proxy_set_header Host $http_host;
    }
    location /v3/api-docs {
        proxy_pass http://core-api:8080;
        proxy_set_header Host $http_host;
    }
    location /swagger-ui {
        proxy_pass http://core-api:8080;
        proxy_set_header Host $http_host;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
