spring:
  application:
    name: syla-core-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/syla}
    username: ${DB_USERNAME:syla}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    default-schema: public

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
syla:
  oidc-issuer: ${OIDC_ISSUER:http://localhost:8081/realms/syla}
  web-origin: ${WEB_ORIGIN:http://localhost:5173}
  identity-backchannel: ${IDENTITY_BACKCHANNEL:http://localhost:8081}
  lifecycle-secret: ${SYLA_LIFECYCLE_SECRET:}
springdoc:
  api-docs:
    version: OPENAPI_3_0
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
