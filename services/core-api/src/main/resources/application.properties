spring.application.name=syla-core-api
spring.threads.virtual.enabled=true
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/syla}
spring.datasource.username=${DB_USER:syla}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.locations=classpath:db/migration/identity,classpath:db/migration/workouts,classpath:db/migration/privacy
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.persist-authorization=false
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.default-property-inclusion=non_null
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
syla.identity.issuer=${OIDC_ISSUER_URI:http://keycloak.localhost:8081/realms/syla}
syla.identity.admin-client-id=syla-admin
syla.identity.admin-client-secret=${KEYCLOAK_SERVICE_SECRET:}
spring.security.oauth2.client.registration.keycloak.client-id=syla-core
spring.security.oauth2.client.registration.keycloak.client-authentication-method=none
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.scope=openid
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.keycloak.issuer-uri=${syla.identity.issuer}
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.urls[0].name=Workouts
springdoc.swagger-ui.urls[0].url=/openapi/workouts.yaml
springdoc.swagger-ui.urls[1].name=Account
springdoc.swagger-ui.urls[1].url=/openapi/identity.yaml
springdoc.swagger-ui.urls[2].name=Privacy
springdoc.swagger-ui.urls[2].url=/openapi/privacy.yaml
springdoc.swagger-ui.urls[3].name=Health
springdoc.swagger-ui.urls[3].url=/openapi/health.yaml
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
spring.jackson.deserialization.accept-float-as-int=false
