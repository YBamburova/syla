name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check patch whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: services/core-api/pom.xml
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare isolated local infrastructure
        run: |
          for key in POSTGRES_PASSWORD DB_PASSWORD KEYCLOAK_DB_PASSWORD KEYCLOAK_ADMIN_PASSWORD SYLA_LIFECYCLE_SECRET; do
            printf '%s=%s\n' "$key" "$(openssl rand -hex 24)" >> .env
          done
          docker compose -p syla-ci up -d --wait --wait-timeout 180 postgres keycloak
      - name: Verify API, module boundaries, OpenAPI contract, and regenerate client
        working-directory: services/core-api
        run: ./mvnw --batch-mode --no-transfer-progress verify -Pgenerate-web-client
      - name: Check generated client is committed and current
        run: |
          git diff --exit-code -- web/src/api/generated
          test -z "$(git ls-files --others --exclude-standard web/src/api/generated)"
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Frontend tests and production build
        working-directory: web
        run: |
          npm test
          npm run build
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test logging and social browser flows against real API
        run: |
          set -a
          . ./.env
          set +a
          java -jar services/core-api/target/core-api.jar > /tmp/syla-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          npm --prefix web run test:e2e
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Stop test infrastructure
        if: ${{ always() }}
        run: docker compose -p syla-ci down
